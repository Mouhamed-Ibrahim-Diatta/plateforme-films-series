
services:

  # ── Laravel (PHP-FPM) ─────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: films_laravel
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: films_db
      DB_USERNAME: films_user
      DB_PASSWORD: 1524
    depends_on:
      - mysql
    networks:
      - films_network

  # ── Nginx (reverse proxy) ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: films_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - films_network

  # ── MySQL ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: films_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: films_db
      MYSQL_USER: films_user
      MYSQL_PASSWORD: 1524
      MYSQL_ROOT_PASSWORD: 1524
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - films_network

  # ── phpMyAdmin ────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: films_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: films_user
      PMA_PASSWORD: 1524
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - films_network

volumes:
  mysql_data:

networks:
  films_network:
    driver: bridge
